# shipctl 配置示例
# ============================================================================
# 这是"示例"，不是生效文件。两种用法：
#
#   1. 插件在 WebUI 里声明了配置表单 → 直接在 WebUI 填，不需要这个文件
#   2. WebUI 里没有表单项 → 把本文件复制成 config.toml 放在插件目录下再改
#
# 注意：config.toml 由 Runner 维护，**不要提交到 git**（.gitignore 已排除）。
# 需要备份配置就备份本文件。
#
# 重要：本文件里没有任何坐标、分辨率、按钮位置。这是刻意的——
# 这个插件不保存任何屏幕几何信息，识别与定位全部在电脑上的 agent 侧完成。
# 如果你在别人的教程里看到 [coordinates] 之类的配置块，那是旧版本，
# 现在会直接被拒绝加载（engine/config.py 会校验未知键）。
# ============================================================================

[plugin]
# SDK 2.7+ 强制要求这一节：Runner 从 plugin.config_version 判定配置是否需要
# 补齐/迁移，缺了这个键会直接拒绝激活插件。
# config_version 由插件维护，升级插件时自动更新，不要手改。
config_version = "0.2.0"

# 插件总开关。关掉后不再接收 /ship 指令。
enabled = true


[connection]

# agent 的地址。
#
# 最常见的错误是把这里填成 127.0.0.1。插件跑在 MaiBot 的 Runner 里，
# 而 MaiBot 通常是容器部署的，127.0.0.1 指向容器自己，永远连不上。
# 要填电脑在局域网里的地址，例如 http://192.168.1.10:8765。
#
# 判断方法：在电脑上用浏览器打开 agent 自带的页面能通，
# 把这个地址原样抄过来即可（把 127.0.0.1 换成电脑的局域网 IP）。
base_url = "http://192.168.1.10:8765"

# agent 侧生成的访问令牌。留空只在 agent 明确允许无令牌访问时可用，
# 默认 agent 会拒绝无令牌请求——这不是 bug，是防止你家里任何设备
# 都能连上来点你屏幕。
token = ""

# 单次请求超时（秒）。识别一张图通常 1~3 秒，20 秒足够。
# 设太小会在电脑卡顿时频繁超时，设太大则出问题时你要等很久才看到报错。
timeout_sec = 20


[safety]
# ---------------------------------------------------------------------------
# 这一节决定"它能做什么"。改这里的每一项之前，先读完注释。
# ---------------------------------------------------------------------------

# 演练模式：只截图、只识别、只报告"如果真跑会做什么"，不产生任何点击。
#
# 首次安装必须保持 true，并且至少跑通一次目标、确认识别的界面是对的，
# 再考虑改成 false。这不是流程洁癖：识别错了还继续点，比不点危险得多。
dry_run = true

# 紧急暂停热键名（例如 "F12"）。
#
# 这个热键必须**在电脑侧的 agent 里设置并生效**，插件只能校验"你填了没有"，
# 无法校验"它真的能按停"。插件不隐瞒这个局限，因为假装能验反而更危险。
# 填了但没在 agent 里配，实跑时按下去是没反应的。
pause_hotkey = ""

# 是否已阅读并接受免责声明。发 /ship disclaimer 可以看到全文。
#
# 保持 false 时，插件拒绝实跑（演练不受影响）。这是硬门槛，不是勾选框装饰。
disclaimer_accepted = false

# 每分钟最多动作次数。超过就等下一分钟。
#
# 这个限制防的不是"你想多点几下"，而是异常循环：某个界面反复识别失败、
# 状态机没能退出，一秒钟能点十几次。20 是一个很保守的值，
# 正常手动操作远远达不到。
max_actions_per_min = 20

# 连续失败几次触发熔断。
#
# 公开版默认 1，即"失败一次就停"。自用版可以放宽到 3，因为你会自己看日志；
# 但分发出去之后，"失败了还在继续试"是用户投诉的主要来源。
# 熔断后需要手动解除（/ship reset），这是故意的——自动恢复等于自动重试。
breaker_threshold = 1

# 熔断冷却时间（秒）。冷却结束也不会自动恢复，仍需手动解除。
breaker_cooldown_sec = 300

# 单次会话最长时长（秒）。到点自动结束，防止"开了就忘了"。
session_max_sec = 1800

# 实跑前是否必须完成校准。
#
# 保持 true。校准的作用是让 agent 知道你屏幕的分辨率和缩放比例，
# 没校准就实跑，等于让它在一张没量过尺寸的图上找按钮。
require_calibration = true


[adapter]
# ---------------------------------------------------------------------------
# 加载哪个游戏适配包。
#
# 适配包 = 数据（界面模板图 + 状态定义 + 目标定义），不含可执行逻辑。
# 插件自带一个 demo 包，只含界面识别、不含任何点击动作。
# ---------------------------------------------------------------------------

# 要用的包 id，对应 game_adapter/ 下的目录名。
#
# 留空 = 自动选第一个"正式包"（非 demo）。改错名字会直接报错而不是静默回落，
# 因为静默回落会让你以为用的是 A 包，实际跑的是 B 包——这种误会很难发现。
pack_id = ""

# 适配包目录的绝对路径。留空 = 用插件自带的 game_adapter/。
#
# 只有二次开发需要改，例如把包放在 NAS 上让几个实例共用。
adapter_dir = ""


[notify]

# 执行结束后回一条结果。
#
# 关掉它的典型场景是循环执行——每隔十分钟播报一次会淹没正常聊天。
on_finish = true

# 出错时回一条说明。建议保持 true：
# 失败却不吭声，用户会以为它还在跑，然后自己动手去点屏幕，反而更乱。
on_error = true

# 出错时是否 @ 你。群聊里建议开，私聊里无所谓。
mention_on_error = false


[runtime]

# 是否允许循环执行（无人值守）。
#
# 默认关闭，因为它的风险等级和单次执行不同：单次执行出错你还能看见，
# 循环执行出错会在你睡觉的时候持续尝试。开启前请确认熔断阈值是 1。
loops_enabled = false

# 循环间隔（秒），仅在 loops_enabled = true 时生效。
loop_interval_sec = 600

# 执行轨迹保留天数。轨迹记录每次跑了什么、哪一步失败、当时识别到什么状态，
# 是排查"它昨天为什么自己停了"的唯一依据。过期自动清理，避免无限增长。
trace_keep_days = 7

# 日志级别：DEBUG / INFO / WARNING / ERROR。
# 排查问题时临时改 DEBUG，问题解决后改回来——DEBUG 会记录每一步的识别细节。
log_level = "INFO"
